<!DOCTYPE html>
<html>
<body>

    <button onclick="artir()">Artir</button>
    <button onclick="azalt()">Azalt</button>

    <script>
        let say = 0;

        function artir() {
            say = say + 1;
            
            console.log(say);
        }

        function azalt() {
            say = say - 1;
            
            console.log(say);
        }
    </script>

</body>
</html>
</html>
