<!DOCTYPE html>
<html>
<body>

    <input type="number" id="reqem1">
    <input type="number" id="reqem2">

    <button onclick="topla()">+</button>
    <button onclick="cix()">-</button>

    <script>
        function topla() {
            let n1 = Number(document.getElementById("reqem1").value);
            let n2 = Number(document.getElementById("reqem2").value);
            
            
            console.log(n1 + n2);
        }

        function cix() {
            let n1 = Number(document.getElementById("reqem1").value);
            let n2 = Number(document.getElementById("reqem2").value);
            
          
            console.log(n1 - n2);
        }
    </script>

</body>
</html>
